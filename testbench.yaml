# Testbench / Workbench configuration for ipsocode/hypervel-cin7.
#
# `workbench/` is the throwaway host application the package is tested against.
# It owns no models, factories or migrations — this package touches no
# database. What it owns instead is the seam a consuming application actually
# has: a service that takes the connector by constructor injection, the Cin7
# response envelopes the suite asserts against, and a console command for
# poking at the live API by hand.

providers:
  # Saloon is auto-discovered in a real application via the components
  # manifest; testbench boots a skeleton app, so it is named explicitly here.
  # It has to come first: Cin7Connector extends Saloon's Connector, and the
  # `saloon` HTTP connection this package sends over is registered by it.
  - Hypervel\Saloon\SaloonServiceProvider
  # The package under test, then the Workbench app that binds its own service
  # on top of the connector the package publishes.
  - Ipsocode\Cin7\Cin7ServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

# Applied to the Testbench CLI (`composer test`, testbench artisan, tinker).
# Testbench does NOT apply these to PHPUnit test methods, so phpunit.xml mirrors
# them under <php><env> — keep the two in step.
env:
  APP_NAME: "Hypervel Cin7 Workbench"
  APP_ENV: testing
  # config/cin7.php reads every one of these through env(), so spelling them
  # out here is what keeps that file under test rather than only its defaults.
  # The credentials are deliberately fake: every send in the suite is faked, and
  # a run that somehow reaches inventory.dearsystems.com should be rejected by
  # Cin7 rather than authenticated against someone's real account.
  CIN7_ACCOUNT_ID: acct-test
  CIN7_APPLICATION_KEY: key-test
  # The packaged defaults, restated. Tests that need different numbers override
  # them per-test through config(), which is the path a consumer's published
  # config takes too.
  CIN7_RATE_MAX: 60
  CIN7_RATE_PERIOD: 60
  CIN7_RETRY_TIMES: 4
  CIN7_RETRY_DELAY_MS: 5000

workbench:
  # Nothing in this package authenticates a user, and there is no HTTP surface
  # to health-check: it is an outbound API client and a console command.
  auth: false
  health: false
  discovers:
    # `workbench/config` is intentionally empty: the package merges its own
    # config from its provider, and the env block above drives it. The hook
    # stays on so an app-level override can be dropped in to reproduce a
    # consumer's configuration without editing this file again.
    config: true
    # No Eloquent models, so no factories or model-name guessers to register.
    factories: false
    web: false
    api: false
    # Loads workbench/routes/console.php and discovers the command classes
    # under workbench/app/Console/Commands — that is `cin7:customers`.
    commands: true
    components: false
    views: false

purge:
  # Paths here are resolved against the runtime *skeleton*, not against
  # workbench/. package:purge-skeleton already removes the env file, the cached
  # testbench.yaml, database/database.sqlite, routes/testbench-*.php and the
  # storage app/session files on its own; these are the extras.
  files:
    - .env
  directories:
    # Hyperf's AOP proxy cache. Regenerated on the next boot, and stale proxies
    # survive a config:clear.
    - storage/framework/aop
